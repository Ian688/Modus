[project]
name = "modus"
version = "0.1.0"
description = "Modus - a multi-mode AI Agent"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Modus contributors" }]
keywords = ["agent", "ai", "cli", "llm", "terminal"]
dependencies = [
    "httpx>=0.27.0",
    "rich>=13.7.0",
    "typer>=0.12.3",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "websockets>=16.1.1",
    "openpyxl>=3.1.5",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
]

[project.scripts]
modus = "modus.entrypoints.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "playwright>=1.45",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
